name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (flake8 + bandit rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Run flake8 (any finding fails the build)
        run: |
          flake8 --version
          flake8 src/ tests/ \
            --format='::error file=%(path)s,line=%(row)d,col=%(col)d,title=flake8 %(code)s::%(code)s %(text)s'

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
